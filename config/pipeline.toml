# Experiment toggles for pipeline/jarvis_v1.py. Read with Python's built-in tomllib (no dependencies).
# Unknown keys are rejected. The values below are the v0 defaults: with them v1 behaves exactly like jarvis_v0.py.
# bench/ablate.py overrides single keys per run through the JARVIS_TUNING env variable (a JSON object).

n_batch = 8                 # prompt tokens evaluated per llama.cpp batch
n_threads = 4               # LLM threads. Machine-specific: re-tune on the demo laptop
max_tokens = 80
history_turns = 4           # history LINES put in the prompt, counting the current "User:" line (3 = last exchange + question)
prompt_style = "v0"         # "v0" (Lumo's wording) | "short" | "tiny" (shortest prompt, last exchange only if short)
stream = false              # speak sentence by sentence while the LLM is still writing (E3)
max_first_chunk_words = 12  # stream only: cut the first chunk at a comma after this many words
length_scale = 1.0          # Piper speech length: below 1.0 is faster (0.88 = about 14 % faster)
stt_model = "vosk-model-small-en-us-0.15"  # folder in baselines/lumo/models/stt; "vosk-model-en-us-0.22-lgraph" hears more accurately (slower start-up, more RAM)
min_conf = 0.0              # drop recognised phrases whose mean word confidence is below this (0 = off; the demo uses 0.5)
noise_gate = 0              # mic frames with RMS below this are silenced before the recognizer (0 = off; int16 scale, try 150-400)
end_silence_ms = 0           # end the phrase after this much quiet following speech (0 = Vosk default; the demo uses 700)
stt_engine = "vosk"          # "vosk" | "whisper" (faster-whisper on CPU; model folder `whisper_model`; phrase ends via end_silence_ms)
whisper_model = "whisper-base.en"  # folder in baselines/lumo/models/stt
llm_backend = "gpt4all"     # "gpt4all" | "llama_cpp" (llama-cpp-python: needed for Gemma 3, which gpt4all cannot load)
llm_model = "orca-mini-3b-gguf2-q4_0.gguf"  # file in baselines/lumo/models/llm; the demo uses "gemma-3-1b-it-Q4_0.gguf" (722 MB) with llama_cpp
mic_device = ""           # sounddevice input device (name part or index as text); "" = system default
